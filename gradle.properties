org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# KSP's Gradle integration registers its generated sources through the kotlin.sourceSets DSL,
# which AGP 9's built-in Kotlin support rejects by default. This is Google's documented opt-out
# (see https://developer.android.com/r/tools/built-in-kotlin) and is what lets Room's generated
# implementation get compiled into the app.
android.disallowKotlinSourceSets=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
